services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env içinde tanımlanmalı}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env içinde tanımlanmalı}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlanmalı}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # OGC servis sunucusu: PostGIS tablolarını WMS (görüntü) ve WFS (vektör) olarak yayınlar.
  geoserver:
    image: kartoza/geoserver:2.26.1
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:?GEOSERVER_ADMIN_USER .env içinde tanımlanmalı}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD .env içinde tanımlanmalı}
    ports:
      - "${GEOSERVER_PORT:-8081}:8080"
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Tek seferlik: workspace, PostGIS datastore ve water_source katmanını REST API ile oluşturur.
  # Tablo backend'in Liquibase migration'ı ile geldiği için backend'i bekler.
  geoserver-init:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./geoserver:/init:ro
    depends_on:
      geoserver:
        condition: service_started
      backend:
        condition: service_healthy
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
      geoserver:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  geoserver-data:
