# Yerel geliştirme profili: veritabanı docker compose ile ayağa kalkan PostGIS'tir
# (`docker compose up -d db`). Kimlik bilgileri repo kökündeki .env dosyasından okunur.
spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
